<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body>

<div class="container my-5">

    <h1 class="text-center text-primary">EXPENSE TRACKER</h1>

    <form id="expenseform">

        <div class="row my-5">

            <input type="text" id="editstatus" hidden>

            <div class="col-lg-3 mb-3">
                <input type="text" id="expensename"
                placeholder="Enter expense name" class="form-control" required>
            </div>

            <div class="col-lg-2 mb-3">
                <input type="number" id="amount"
                placeholder="Enter amount" class="form-control"
                min="0.01" step="0.01" required>
            </div>

            <div class="col-lg-2 mb-3">
                <select id="category" class="form-select" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Others">Others</option>
                </select>
            </div>

            <div class="col-lg-3 mb-3">
                <input type="date" id="date"
                class="form-control" required>
            </div>

            <div class="col-lg-2 mb-3">
                <button type="submit" class="btn btn-success w-100">
                    Save
                </button>
            </div>

        </div>
    </form>

    <!-- Total Expense -->
    <h4 class="text-success">
        Total Expense: ₹<span id="total">0</span>
    </h4>

    <!-- Category Filter -->
    <div class="row my-4">
        <div class="col-lg-4">
            <select id="filtercategory" class="form-select">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Others">Others</option>
            </select>
        </div>
    </div>

    <!-- Expense Table -->
    <table class="my-5 table table-bordered table-hover text-center">

        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Expense Name</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="tablebody">

        </tbody>

    </table>

</div>

<script src="./main.js"></script>

</body>
</html>
